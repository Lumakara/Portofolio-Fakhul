<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .wrapper {
      max-width: 600px;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: fadeInDown 0.8s ease forwards;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      opacity: 0.9;
      animation: fadeInUp 1s ease forwards;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      color: #6366f1;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .btn-home:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="icon"><i class="ri-tools-fill"></i></div>
    <h1>Coming Soon 🚀</h1>
    <p>Kami sedang menyiapkan fitur baru yang keren banget. Stay tuned untuk update selanjutnya!</p>
    <a href="index.html" class="btn-home"><i class="ri-home-line"></i> Kembali ke Beranda</a>
  </div>
</body>
</html>
